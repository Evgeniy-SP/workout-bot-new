name: Python CI
run-name: Python CI 🧪 · ${{ github.event.head_commit.message }} · by @${{ github.actor }}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: Run tests with coverage
      run: |
        pytest --cov=app --cov-report=term-missing --cov-report=xml tests/ -v
        
    - name: Add coverage to job summary
      run: |
        python - <<'PY'
        import os
        import xml.etree.ElementTree as ET

        coverage = ET.parse("coverage.xml").getroot()
        percent = float(coverage.attrib["line-rate"])
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
            summary.write(f"## Покрытие тестами\n\n**{percent:.2%}** строк приложения\n")
        PY
